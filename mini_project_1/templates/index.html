{% extends "base.html" %}
{% block title %}Mini Tracker{% endblock %}
{% block content %}

    <div class="parent-container">
        <div class="left-box">
            <!-- AI bot loaded here -->
             <p id="personality"></p>
        </div>
        <div class="middle-box">
            <!-- GLTF files loaded here -->
            <script type="module" src="../static/main.js"></script>
             <canvas id="scene"></canvas>
        </div>
        <div class="right-box">
            <div class="info-box">
                <h1 id="output">click a button</h1>
            </div>
            <div class="button-grid">
                <button
                    data-text="Cost: {disk_free_gb} GB of space left out of {disk_total_gb} GB."
                    data-footer="Disk space is what's left for everything you haven't saved yet.">File</button>

                <button
                    data-text="Your first visit was {first_visit}."
                    data-footer="We will never forget your first visit.">Cake</button>

                <button
                    data-text="Cost: {ram_free_gb} GB of RAM free out of {ram_total_gb} GB."
                    data-footer="RAM is the memory this page is using right now.">Cookie</button>

                <button
                    data-text="You have clicked {clicks} times and left this tab {tab_leaves} times."
                    data-footer="Every click and every tab leave is being counted.">ADHD Pill</button>

                <button
                    data-text="[insert airplane info]"
                    data-footer="[airplane bottom text]">Airplane</button>

                <button
                    id="exitBtn"
                    data-text="Make a selection: "
                    data-footer="">Exit</button>
                    <button id="btnLoc">Add approximate location</button>
            </div>
        </div>
    </div>

    <footer class="fixed-footer" id="footer">Click a button</footer>

    <div id="location-section">
        
        <div id="location-results"></div>
    </div>

    <script>

    // send an event to flask; flask adds one to this visitor's session counter
    async function log(event) {
        await fetch("/log", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ event: event }),
            keepalive: true
        });
    }

    // count clicks
    addEventListener("click", () => log("clicks"));

    // count tab leaves
    document.addEventListener("visibilitychange", () => {
        if (document.hidden) log("tab_leaves");
    });

    // swap {key} placeholders with values from the info object
    const fill = (template, info) =>
        template.replace(/\{(\w+)\}/g, (_, key) => info[key] ?? "?");

    // each button shows its own text, filled with fresh data from /info
    document.querySelectorAll("button[data-text]").forEach(btn => {
        btn.addEventListener("click", async () => {
            const info = await (await fetch("/info")).json();

            // make the saved timestamp readable
            if (info.first_visit) {
                info.first_visit = new Date(info.first_visit).toLocaleString();
            }

            document.getElementById("output").textContent = fill(btn.dataset.text, info);
            document.getElementById("footer").textContent = fill(btn.dataset.footer || "", info);

            document.getElementById("personality").textContent = "Loading user assumptions..."; 
            const prompt = await (await fetch("/prompt")).text(); 

            document.getElementById("personality").textContent = prompt; 

        });
    });

    /* IPWho.is Location Lookup */
    document.getElementById("btnLoc").addEventListener("click", async (event) => {
        try {
            // 1. Pauses here until the network request finishes
            const response = await fetch('https://ipwho.is');
            const data = await response.json();

            // 2. Runs only after the data is ready
            console.log(data);
        } catch (error) {
            // 3. Catches network or parsing errors cleanly
            console.error('Failed to load data:', error);
        }
    });

//     const out = document.getElementById("oracleOutput");
// document.getElementById("oracleBtn").onclick = async () => {
//     out.textContent = "The oracle is reading your session...";
//     out.textContent = await (await fetch("/personality")).text();
// };
    </script>

{% endblock %}
