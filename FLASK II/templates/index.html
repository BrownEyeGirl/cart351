
{% extends "base.html" %} <!-- extends statement establishes the inheritance link between the two templates, so that Jinja knows that when it is asked to render index.html it needs to embed it inside base.html -->
<!-- Dynamically driven content -->
{% block content %} <!-- The two templates (index.html and base.html) have matching block statements with the name content, this is how Jinja knows how to combine the two templates into one.-->
    <h1>Hi, {{ user.username }}!</h1>
    <section class = "flex-intro">
    <div class="items">
    {% for item in passedDictionary %}
    
        <p>The key is: <span class ="dict_key">{{item}}</span> and the value is: 
        <span class ="dict_value">{{passedDictionary[item]}}</span>
    </p>

    {% endfor %}
    </div>
    <div class = "img_div">
        <img src = {{imgPath}} />
    </div>
    </section>
{% endblock %}
