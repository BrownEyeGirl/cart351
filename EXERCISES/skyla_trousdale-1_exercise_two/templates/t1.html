<!-- page will be a child of base.html -->
{% extends "base.html" %}
{% block content %}

<section class = "inputData">
    <form  action="{{url_for('getSearchCriteria')}}">
    <h3>NASA API SEARCH CRITERIA</h3>
        <fieldset> 
        <p>
            <input type="text" size="24" maxlength="40" name="search_query" placeholder="search for..." required> 
        </p>
            <input id="submitBtn" type = "submit" name="submit" style="margin: 10px "/>
        </p>
        </fieldset>
    </form>
</section>

{% if have_results %}
    <section class = "results">
        <h3>Results</h3>
        <p> Description: {{description}}</p>
        <img src="{{imgPath}}" alt="NASA Image" />
    </section>
{% endif %}

{% endblock %}
